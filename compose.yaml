services:
  app:
    image: '${SAIL_IMAGE:-signage-sail-8.4/app}'
    build:
      context: './docker/8.4'
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP:-1000}'
        http_proxy: '${SAIL_BUILD_PROXY:-}'
        https_proxy: '${SAIL_BUILD_PROXY:-}'
        HTTP_PROXY: '${SAIL_BUILD_PROXY:-}'
        HTTPS_PROXY: '${SAIL_BUILD_PROXY:-}'
        no_proxy: 'localhost,127.0.0.1,::1'
        NO_PROXY: 'localhost,127.0.0.1,::1'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      WWWGROUP: '${WWWGROUP:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
    volumes:
      - '.:/var/www/html'
      - './docker/8.4/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro'
    ports:
      - '${VITE_PORT:-5173}:5173'
      - '8080:8080'
    networks:
      - sail
    healthcheck:
      test: ['CMD', 'php', '-r', 'exit(@fsockopen("127.0.0.1", 9000) ? 0 : 1);']
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: 'nginx:stable-alpine'
    ports:
      - '${APP_PORT:-80}:80'
    volumes:
      - '.:/var/www/html:ro'
      - './docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
    networks:
      - sail
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/up']
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      app:
        condition: service_healthy

  pgsql:
    image: 'postgres:17-alpine'
    ports:
      - '${FORWARD_DB_PORT:-5432}:5432'
    environment:
      PGPASSWORD: '${DB_PASSWORD:-secret}'
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    volumes:
      - 'sail-pgsql17:/var/lib/postgresql/data'
      - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql:ro'
    networks:
      - sail
    healthcheck:
      test: ['CMD', 'pg_isready', '-q', '-d', '${DB_DATABASE}', '-U', '${DB_USERNAME}']
      interval: 5s
      retries: 10
      timeout: 5s

  redis:
    image: 'redis:7-alpine'
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - 'sail-redis7:/data'
    networks:
      - sail
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
      timeout: 5s

networks:
  sail:
    driver: bridge

volumes:
  sail-pgsql17:
    driver: local
  sail-redis7:
    driver: local